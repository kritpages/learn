name: Deploy Static Apps to GitHub Pages

# Publishes every subject folder that has an index.html (maths/, physics/, …) to GitHub Pages,
# so each app is served at /<repo>/<subject>/ (for example /learn/maths/). There is no root page.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static applications
        run: |
          mkdir -p site

          for app in */; do
            if [ -f "${app}index.html" ]; then
              echo "Adding application: ${app}"
              cp -a "$app" site/
            fi
          done

          test -n "$(find site -name index.html -print -quit)"

          # Serve the files as they are, with no Jekyll processing.
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
