name: Deploy Static Apps to GitHub Pages

# Publishes every subject folder that has an index.html (maths/, physics/, …) to GitHub Pages,
# so each app is served at /<repo>/<subject>/. The root index.html (the subject list) is published too.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static applications
        run: |
          mkdir -p site

          for app in */; do
            if [ -f "${app}index.html" ]; then
              echo "Adding application: ${app}"
              cp -a "$app" site/
            fi
          done

          test -n "$(find site -name index.html -print -quit)"

          # Landing page listing the subjects, and no Jekyll processing.
          if [ -f index.html ]; then cp index.html site/; fi
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
