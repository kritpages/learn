<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Learn</title>
  <style>
    :root { --ink: #18202a; --muted: #5f6872; --paper: #f5f6f2; --card: #fff; --line: #e0e2da; --accent: #2c6fb7; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e8ebef; --muted: #a7afb9; --paper: #11151a; --card: #1a2027; --line: #2e363f; --accent: #7fb2ea; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 880px; margin: auto; padding: 48px 16px; }
    h1 { font-size: clamp(32px, 6vw, 44px); margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    a { display: block; padding: 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--accent); color: inherit; text-decoration: none; }
    a:hover { border-color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    strong { display: block; font-size: 22px; }
    span { color: var(--muted); font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Learn</h1>
    <p>Free study guides for CBSE students. Pick a subject.</p>
    <!-- Add one <li> per subject folder (maths/, physics/, …). -->
    <ul>
      <li><a href="maths/"><strong>Maths Explorer</strong><span>CBSE Mathematics, Grades 3 to 10</span></a></li>
    </ul>
  </main>
</body>
</html>
